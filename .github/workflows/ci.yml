name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run ci

  react-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["16.14.0", "17.0.2", "18.3.1"]
    name: react ${{ matrix.react }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm install --no-save --no-audit --no-fund react@${{ matrix.react }} react-dom@${{ matrix.react }}

      - run: npx playwright install --with-deps chromium

      - run: npm test
